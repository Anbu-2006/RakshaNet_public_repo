<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#08101E" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="primary_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>

    <!-- Shield Glow Gradient -->
    <linearGradient id="shield_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber_grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>

    <!-- Radar Blur Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bg_grad)" />
  <rect width="1200" height="380" rx="16" fill="url(#cyber_grid)" />

  <!-- Outer Border -->
  <rect x="1.5" y="1.5" width="1197" height="377" rx="15" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="190" r="140" fill="#00F2FE" fill-opacity="0.06" filter="url(#glow)" />
  <circle cx="1050" cy="190" r="140" fill="#10B981" fill-opacity="0.06" filter="url(#glow)" />

  <!-- Central Shield / Radar Emblem Group -->
  <g transform="translate(100, 105)">
    <!-- Radar concentric rings -->
    <circle cx="85" cy="85" r="75" fill="none" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 4" />
    <circle cx="85" cy="85" r="55" fill="none" stroke="#00E676" stroke-width="1" stroke-opacity="0.25" />
    <circle cx="85" cy="85" r="35" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 2" />

    <!-- Outer Shield Hex -->
    <path d="M85 20 L135 48 V98 C135 130 85 152 85 152 C85 152 35 130 35 98 V48 Z" 
          fill="#0F172A" fill-opacity="0.9" stroke="url(#shield_grad)" stroke-width="3.5" filter="url(#glow)" />

    <!-- Inner Keyhole & Intercept Nodes -->
    <path d="M85 55 C77 55 70 62 70 70 C70 76 74 81 79 83 L75 110 H95 L91 83 C96 81 100 76 100 70 C100 62 93 55 85 55 Z" 
          fill="url(#primary_glow)" />
    
    <!-- Pulse Ring -->
    <circle cx="85" cy="70" r="4" fill="#FFFFFF" />
  </g>

  <!-- Typography: Header Area -->
  <g transform="translate(310, 75)">
    <!-- Category Pill Tag -->
    <rect x="0" y="0" width="370" height="28" rx="14" fill="#0369A1" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="16" cy="14" r="5" fill="#00E676" />
    <text x="32" y="19" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SMART INDIA HACKATHON • PS 26184</text>

    <!-- Main Title -->
    <text x="0" y="78" fill="url(#primary_glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="1">RakshaNet</text>

    <!-- Subtitle -->
    <text x="0" y="112" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="0.5">Predictive Cash-Out Interception &amp; Core Banking Switch Defense</text>

    <!-- Description / Mandate -->
    <text x="0" y="140" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">
      Real-time 1930 Helpline Telephony Ingestion • Financial NER • Section 106 BNSS 2023 Statutory Freezes
    </text>
  </g>

  <!-- Bottom Metric Pills Grid -->
  <g transform="translate(310, 245)">
    <!-- Metric 1: Tactical Window -->
    <g transform="translate(0, 0)">
      <rect width="195" height="68" rx="10" fill="url(#card_grad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.35" />
      <text x="16" y="26" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.8">TACTICAL WINDOW</text>
      <text x="16" y="52" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800">&lt; 3 Minutes</text>
    </g>

    <!-- Metric 2: Statutory Power -->
    <g transform="translate(210, 0)">
      <rect width="195" height="68" rx="10" fill="url(#card_grad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.35" />
      <text x="16" y="26" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.8">STATUTORY AUTHORITY</text>
      <text x="16" y="52" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800">Sec 106 BNSS '23</text>
    </g>

    <!-- Metric 3: Banking Standard -->
    <g transform="translate(420, 0)">
      <rect width="195" height="68" rx="10" fill="url(#card_grad)" stroke="#818CF8" stroke-width="1" stroke-opacity="0.35" />
      <text x="16" y="26" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.8">INTERBANK SWITCH</text>
      <text x="16" y="52" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800">ISO 20022 camt.056</text>
    </g>

    <!-- Metric 4: RBI Verification -->
    <g transform="translate(630, 0)">
      <rect width="195" height="68" rx="10" fill="url(#card_grad)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.35" />
      <text x="16" y="26" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.8">RBI DIRECTORY</text>
      <text x="16" y="52" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800">150K+ Branches</text>
    </g>
  </g>

  <!-- Top-Right Status Pulse Indicator -->
  <g transform="translate(1030, 35)">
    <rect width="130" height="30" rx="15" fill="#064E3B" fill-opacity="0.6" stroke="#059669" stroke-width="1" />
    <circle cx="20" cy="15" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="20" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">LIVE DEFENSE</text>
  </g>
</svg>
